<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>今天吃什么？</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #FFF8F0;
  min-height: 100dvh;
  color: #3D2C1E;
  overflow-x: hidden;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 28px;
  margin-top: 12px;
  width: 100%;
}
.header h1 {
  font-size: 26px;
  font-weight: 700;
  color: #E8652D;
  letter-spacing: 1px;
}
.header p {
  font-size: 14px;
  color: #A08060;
  margin-top: 2px;
}
.gear-btn {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  padding: 4px;
  opacity: 0.6;
  transition: opacity 0.2s, transform 0.3s;
  margin-top: 2px;
}
.gear-btn:hover { opacity: 1; }
.gear-btn.spinning-gear {
  animation: gearSpin 0.5s ease;
}
@keyframes gearSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(90deg); }
}

/* Tabs */
.tabs {
  display: flex;
  background: #F0E4D6;
  border-radius: 16px;
  padding: 4px;
  width: 100%;
  max-width: 280px;
  margin-bottom: 32px;
}
.tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: #8B6E55;
  user-select: none;
}
.tab.active {
  background: #E8652D;
  color: #fff;
  box-shadow: 0 2px 10px rgba(232, 101, 45, 0.3);
}

/* Big Button */
.pick-btn {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #FF8A4C, #E8652D);
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(232, 101, 45, 0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  margin-bottom: 36px;
  position: relative;
  letter-spacing: 1px;
  line-height: 1.4;
}
.pick-btn:active {
  transform: scale(0.94);
  box-shadow: 0 2px 12px rgba(232, 101, 45, 0.3);
}
.pick-btn.spinning {
  animation: spin-bounce 0.6s ease;
}
@keyframes spin-bounce {
  0% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(0.9) rotate(-10deg); }
  50% { transform: scale(1.08) rotate(5deg); }
  75% { transform: scale(0.97) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.pick-btn .emoji {
  display: block;
  font-size: 36px;
  margin-bottom: 4px;
}

/* Results */
.results {
  width: 100%;
  display: none;
}
.results.show {
  display: block;
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: 0 2px 12px rgba(139, 110, 85, 0.08);
  border: 1px solid #F0E4D6;
}
.result-card h3 {
  font-size: 14px;
  color: #A08060;
  margin-bottom: 10px;
  font-weight: 500;
}
.dish-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.dish-tag {
  background: linear-gradient(135deg, #FFF0E0, #FFE4CC);
  color: #C05020;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  animation: popIn 0.4s ease backwards;
}
.dish-tag:nth-child(1) { animation-delay: 0.1s; }
.dish-tag:nth-child(2) { animation-delay: 0.2s; }
.dish-tag:nth-child(3) { animation-delay: 0.3s; }
.dish-tag:nth-child(4) { animation-delay: 0.4s; }
@keyframes popIn {
  from { opacity: 0; transform: scale(0.6); }
  to { opacity: 1; transform: scale(1); }
}
.dish-tag.eat-out {
  background: linear-gradient(135deg, #FFE0E0, #FFD0C0);
  color: #C03030;
}

/* Hint */
.hint {
  text-align: center;
  color: #C0A888;
  font-size: 13px;
  margin-top: 16px;
}

/* Footer */
.footer {
  margin-top: auto;
  padding-top: 32px;
  text-align: center;
  color: #D0BFA8;
  font-size: 12px;
}

/* ===== Settings Panel ===== */
.settings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  animation: fadeIn 0.2s ease;
}
.settings-overlay.open {
  display: flex;
  align-items: flex-end;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.settings-panel {
  background: #FFF8F0;
  width: 100%;
  max-height: 88vh;
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 40px;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.settings-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.settings-header h2 {
  font-size: 20px;
  color: #E8652D;
}
.settings-close {
  background: #F0E4D6;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8B6E55;
}

.settings-section {
  margin-bottom: 20px;
}
.settings-section-title {
  font-size: 13px;
  color: #A08060;
  font-weight: 600;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.meal-toggle {
  display: flex;
  background: #F0E4D6;
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 16px;
}
.meal-toggle-btn {
  flex: 1;
  padding: 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  color: #8B6E55;
  border: none;
  background: none;
  transition: all 0.2s;
}
.meal-toggle-btn.active {
  background: #fff;
  color: #E8652D;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

.dish-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  border: 1px solid #F0E4D6;
  animation: slideIn 0.2s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.dish-item span {
  flex: 1;
  font-size: 15px;
}
.dish-item .del-btn {
  background: #FFE0E0;
  color: #C03030;
  border: none;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
}

.add-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.add-row input {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid #F0E4D6;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: #fff;
  color: #3D2C1E;
  font-family: inherit;
}
.add-row input:focus {
  border-color: #E8652D;
}
.add-row input::placeholder {
  color: #C0A888;
}
.add-row button {
  background: #E8652D;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}

.reset-btn {
  display: block;
  width: 100%;
  background: none;
  border: 2px dashed #E0C8B0;
  color: #A08060;
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  cursor: pointer;
  text-align: center;
  margin-top: 8px;
  font-family: inherit;
}

.save-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #3D2C1E;
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 200;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.5s forwards;
  pointer-events: none;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🍽️ 今天吃什么？</h1>
    <button class="gear-btn" id="gearBtn" onclick="openSettings()">⚙️</button>
  </div>
  <p style="font-size:14px;color:#A08060;margin-top:-20px;margin-bottom:20px;text-align:center">选择一餐，随机帮你决定</p>

  <div class="tabs">
    <div class="tab active" data-meal="lunch" onclick="switchTab('lunch')">☀️ 午餐</div>
    <div class="tab" data-meal="dinner" onclick="switchTab('dinner')">🌙 晚餐</div>
  </div>

  <button class="pick-btn" onclick="pick()">
    <span class="emoji">🎲</span>
    今天吃什么？
  </button>

  <div class="results" id="results"></div>
  <p class="hint" id="hint" style="display:none">再点一次，换一套搭配 👆</p>

  <div class="footer">吃饱了才有力气减肥 🐷</div>
</div>

<!-- Settings Overlay -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <h2>⚙️ 管理菜品</h2>
      <button class="settings-close" onclick="closeSettings()">✕</button>
    </div>

    <div class="meal-toggle">
      <button class="meal-toggle-btn active" id="editLunchBtn" onclick="switchEditMeal('lunch')">☀️ 午餐</button>
      <button class="meal-toggle-btn" id="editDinnerBtn" onclick="switchEditMeal('dinner')">🌙 晚餐</button>
    </div>

    <!-- Lunch categories -->
    <div id="editLunch">
      <div class="settings-section">
        <div class="settings-section-title">🥩 荤菜</div>
        <div id="edit-meat-list"></div>
        <div class="add-row">
          <input type="text" id="input-meat" placeholder="输入新菜品，回车添加" onkeydown="if(event.key==='Enter')addItem('meat')">
          <button onclick="addItem('meat')">添加</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">🌿 叶菜</div>
        <div id="edit-vegLeaf-list"></div>
        <div class="add-row">
          <input type="text" id="input-vegLeaf" placeholder="输入新菜品，回车添加" onkeydown="if(event.key==='Enter')addItem('vegLeaf')">
          <button onclick="addItem('vegLeaf')">添加</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">🥔 根茎</div>
        <div id="edit-vegRoot-list"></div>
        <div class="add-row">
          <input type="text" id="input-vegRoot" placeholder="输入新菜品，回车添加" onkeydown="if(event.key==='Enter')addItem('vegRoot')">
          <button onclick="addItem('vegRoot')">添加</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">🍳 其他素菜</div>
        <div id="edit-vegOther-list"></div>
        <div class="add-row">
          <input type="text" id="input-vegOther" placeholder="输入新菜品，回车添加" onkeydown="if(event.key==='Enter')addItem('vegOther')">
          <button onclick="addItem('vegOther')">添加</button>
        </div>
      </div>
    </div>

    <!-- Dinner categories -->
    <div id="editDinner" style="display:none">
      <div class="settings-section">
        <div class="settings-section-title">🍳 快手菜</div>
        <div id="edit-quick-list"></div>
        <div class="add-row">
          <input type="text" id="input-quick" placeholder="输入新菜品，回车添加" onkeydown="if(event.key==='Enter')addItem('quick')">
          <button onclick="addItem('quick')">添加</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">🚶 出去吃</div>
        <div id="edit-eatOut-list"></div>
        <div class="add-row">
          <input type="text" id="input-eatOut" placeholder="输入新菜品，回车添加" onkeydown="if(event.key==='Enter')addItem('eatOut')">
          <button onclick="addItem('eatOut')">添加</button>
        </div>
      </div>
    </div>

    <button class="reset-btn" onclick="resetToDefault()">🔄 重置为默认菜品</button>
  </div>
</div>

<script>
// ===== Default Database =====
const DEFAULT_DB = {
  lunch: {
    meat: [
      '可乐鸡翅', '红烧肉', '糖醋排骨', '清蒸鲈鱼', '红烧排骨',
      '土豆烧牛肉', '宫保鸡丁（去辣版）', '木须肉', '蒜蓉蒸虾',
      '鱼香肉丝（去辣版）', '水煮牛肉（去辣版）', '酸菜鱼', '回锅肉'
    ],
    vegLeaf: [
      '清炒时蔬', '蒜蓉西兰花', '清炒豆芽', '凉拌黄瓜',
      '蒜蓉空心菜', '耗油生菜', '炒青菜'
    ],
    vegRoot: [
      '土豆丝', '炒三丝', '干煸四季豆', '清炒藕片',
      '蒜蓉山药', '清炒萝卜丝', '凉拌木耳'
    ],
    vegOther: [
      '番茄炒蛋', '蒸茄子', '黄瓜拌蛋', '松仁玉米'
    ]
  },
  dinner: {
    quick: [
      '蛋炒饭', '番茄鸡蛋面', '葱油拌面', '煎饺', '炒方便面',
      '烤冷面', '手抓饼', '鸡蛋饼', '三明治', '馄饨',
      '煎鸡蛋', '炒河粉', '酱油炒饭'
    ],
    eatOut: [
      '川菜馆', '湘菜馆', '粤菜馆', '火锅', '烧烤',
      '日料', '韩式料理', '西餐厅', '串串香', '面馆',
      '饺子馆', '麻辣烫（去辣）', '自助餐'
    ]
  }
};

// ===== State =====
let DB = null; // loaded from server
let currentMeal = 'lunch';
let editMeal = 'lunch';
const STORAGE_KEY = 'lunch-picker-db';

// ===== API Persistence =====
async function loadDB() {
  try {
    const res = await fetch('/api/recipes');
    if (res.ok) DB = await res.json();
    else DB = JSON.parse(JSON.stringify(DEFAULT_DB));
  } catch(e) {
    DB = JSON.parse(JSON.stringify(DEFAULT_DB));
  }
}
loadDB();

async function saveDB() {
  showToast('📝 跳转到 GitHub 编辑菜品...');
  setTimeout(() => {
    window.open('https://github.com/liyongkuan2018-commits/lunch-picker/edit/main/recipes.json', '_blank');
  }, 800);
}

// ===== Toast =====
function showToast(msg) {
  const old = document.querySelector('.save-toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'save-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

// ===== Tab Switch =====
function switchTab(meal) {
  currentMeal = meal;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.meal === meal));
  document.getElementById('results').classList.remove('show');
  document.getElementById('hint').style.display = 'none';
}

// ===== Random Pick =====
function pickRandom(arr, n) {
  if (!DB) return [];

  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

async function pick() {
  if (!DB) {
    showToast('加载中，稍等一下...');
    return;
  }
  const btn = document.querySelector('.pick-btn');
  btn.classList.remove('spinning');
  void btn.offsetWidth;
  btn.classList.add('spinning');

  let html = '';
  if (currentMeal === 'lunch') {
    const meatCount = Math.random() > 0.5 ? 2 : 1;
    const meats = pickRandom(DB.lunch.meat, meatCount);
    const vegLeaf = pickRandom(DB.lunch.vegLeaf, 1);
    const vegRoot = pickRandom(DB.lunch.vegRoot, 1);
    const vegOther = pickRandom(DB.lunch.vegOther, 1);
    html += '<div class="result-card"><h3>🥩 荤菜</h3><div class="dish-list">' + meats.map(m => '<span class="dish-tag">' + m + '</span>').join('') + '</div></div>';
    html += '<div class="result-card"><h3>🌿 叶菜</h3><div class="dish-list">' + vegLeaf.map(v => '<span class="dish-tag">' + v + '</span>').join('') + '</div></div>';
    html += '<div class="result-card"><h3>🥔 根茎</h3><div class="dish-list">' + vegRoot.map(v => '<span class="dish-tag">' + v + '</span>').join('') + '</div></div>';
    html += '<div class="result-card"><h3>🍳 其他</h3><div class="dish-list">' + vegOther.map(v => '<span class="dish-tag">' + v + '</span>').join('') + '</div></div>';
  } else {
    const goOut = Math.random() > 0.45;
    if (goOut) {
      const place = pickRandom(DB.dinner.eatOut, 1)[0];
      html += '<div class="result-card"><h3>🚶 出去吃</h3><div class="dish-list"><span class="dish-tag eat-out">' + place + '</span></div></div>';
    } else {
      const count = Math.random() > 0.5 ? 2 : 1;
      const dishes = pickRandom(DB.dinner.quick, count);
      html += '<div class="result-card"><h3>🍳 快手菜</h3><div class="dish-list">' + dishes.map(d => '<span class="dish-tag">' + d + '</span>').join('') + '</div></div>';
    }
  }

  const results = document.getElementById('results');
  results.innerHTML = html;
  results.classList.remove('show');
  void results.offsetWidth;
  results.classList.add('show');
  document.getElementById('hint').style.display = 'block';
}

// ===== Settings =====
function openSettings() {
  const gear = document.getElementById('gearBtn');
  gear.classList.remove('spinning-gear');
  void gear.offsetWidth;
  gear.classList.add('spinning-gear');
  renderEditLists();
  document.getElementById('settingsOverlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function switchEditMeal(meal) {
  editMeal = meal;
  document.getElementById('editLunchBtn').classList.toggle('active', meal === 'lunch');
  document.getElementById('editDinnerBtn').classList.toggle('active', meal === 'dinner');
  document.getElementById('editLunch').style.display = meal === 'lunch' ? 'block' : 'none';
  document.getElementById('editDinner').style.display = meal === 'dinner' ? 'block' : 'none';
}

function renderEditLists() {
  // Lunch
  if (editMeal === 'lunch') {
    renderList('edit-meat-list', DB.lunch.meat, 'meat');
    renderList('edit-vegLeaf-list', DB.lunch.vegLeaf, 'vegLeaf');
    renderList('edit-vegRoot-list', DB.lunch.vegRoot, 'vegRoot');
    renderList('edit-vegOther-list', DB.lunch.vegOther, 'vegOther');
  } else {
    renderList('edit-quick-list', DB.dinner.quick, 'quick');
    renderList('edit-eatOut-list', DB.dinner.eatOut, 'eatOut');
  }
}

function renderList(elId, items, key) {
  const el = document.getElementById(elId);
  if (items.length === 0) {
    el.innerHTML = '<div style="color:#C0A888;font-size:14px;text-align:center;padding:12px">还没有菜品，添加一个吧~</div>';
    return;
  }
  el.innerHTML = items.map((item, i) => `
    <div class="dish-item">
      <span>${item}</span>
      <button class="del-btn" onclick="delItem('${key}', ${i})">删除</button>
    </div>
  `).join('');
}

async function addItem(key) {
  const inputMap = {
    meat: 'input-meat', vegLeaf: 'input-vegLeaf', vegRoot: 'input-vegRoot',
    vegOther: 'input-vegOther', quick: 'input-quick', eatOut: 'input-eatOut'
  };
  const input = document.getElementById(inputMap[key]);
  const val = input.value.trim();
  if (!val || !DB) return;
  const section = key.startsWith('veg') || key === 'meat' ? 'lunch' : 'dinner';
  if (section === 'lunch') {
    DB.lunch[key].push(val);
  } else {
    DB.dinner[key].push(val);
  }
  input.value = '';
  renderEditLists();
}

async function delItem(key, index) {
  if (!DB) return;
  if (editMeal === 'lunch') {
    DB.lunch[key].splice(index, 1);
  } else {
    DB.dinner[key].splice(index, 1);
  }
  renderEditLists();
}

async function resetToDefault() {
  if (!confirm('确定要重置所有菜品为默认吗？')) return;
  DB = JSON.parse(JSON.stringify(DEFAULT_DB));
  renderEditLists();
}

// Close overlay on backdrop click
document.getElementById('settingsOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});
</script>
</body>
